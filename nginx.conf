server {
    listen 80;
    server_name _;

    # Serve built Vue SPA static files
    root /app/frontend/dist;
    index index.html;

    # SPA fallback: any path that is not a real file falls through to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* and /health to the Gunicorn backend
    location ~ ^/(api|health)(/|$) {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Match the 5-minute axios timeout used by the frontend
        proxy_read_timeout    300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;

        # Disable buffering for streaming/SSE responses
        proxy_buffering off;
    }

    # Disable access log noise for favicon and robots
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }
}
